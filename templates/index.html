<style>
:root{--paper:#f6f3ed;--ink:#29382e;--muted:#687168;--line:#d9ded3;--green:#2c583e;--soft:#e5ecdf;--accent:#b25b35}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Avenir Next","PingFang SC","Microsoft YaHei",sans-serif;font-size:15px}button,a,input,select{touch-action:manipulation}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:4px}button{border:0;background:none}a{color:inherit}main{max-width:1080px;padding:38px 38px 165px;margin:auto}.mast{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:22px}.brand{font-weight:650;font-size:19px;letter-spacing:1px}.brand i{font-family:Georgia,serif;font-weight:400;font-size:24px;margin-left:8px}.local{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px}.local:before{content:"";width:6px;height:6px;background:var(--green);border-radius:50%}.intro{padding:45px 0 32px;display:flex;align-items:flex-end;justify-content:space-between;gap:20px}.eyebrow{font-size:11px;letter-spacing:2px;color:var(--muted);margin:0 0 13px}h1{font-family:"Songti SC","STSong",Georgia,serif;font-size:clamp(30px,4vw,44px);font-weight:500;letter-spacing:1px;margin:0}.count{color:var(--muted);font-size:13px;white-space:nowrap}.filters{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:8px 0 20px;flex-wrap:wrap}.tabs{display:flex;gap:4px}.filter{padding:12px 17px;min-height:44px;border-radius:5px;color:var(--muted)}.filter[aria-pressed=true]{background:var(--green);color:var(--paper)}.favorite-filter{border:1px solid var(--line);padding:10px 15px;min-height:44px;border-radius:5px}.favorite-filter[aria-pressed=true]{background:var(--soft);border-color:var(--green)}.list-label{display:grid;grid-template-columns:56px 1.5fr 1fr 64px 100px;gap:15px;padding:15px 12px;border-bottom:1px solid var(--ink);font-size:11px;color:var(--muted);letter-spacing:1px}.list-label span:first-child{grid-column:2}.row{display:grid;grid-template-columns:56px 1.5fr 1fr 64px 100px;gap:15px;align-items:center;min-height:98px;padding:16px 12px;border-bottom:1px solid var(--line);transition:background .18s}.row.selected{background:var(--soft)}.play{width:48px;height:48px;border:1px solid #b9c4b7;border-radius:50%;display:grid;place-items:center}.row.selected .play{background:var(--green);color:var(--paper);border-color:var(--green)}.play svg{width:18px;height:18px}.name{font-size:18px;font-weight:600;display:flex;align-items:center;gap:10px}.serial{font-family:Georgia,serif;font-size:21px;font-weight:400}.sub{font-size:12px;color:var(--muted);margin-top:7px}.note{font-size:10px;color:var(--green);border:1px solid #acbda7;padding:3px 6px;font-weight:500;border-radius:3px}.wave{color:#a8b7a1;display:block;width:100%;height:32px}.selected .wave{color:var(--green)}.duration{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}.actions{display:flex;gap:4px;justify-content:flex-end}.icon{width:44px;height:44px;display:grid;place-items:center;text-decoration:none;border-radius:4px}.icon:hover{background:#dce5d5}.icon svg{height:19px;width:19px}.fav[aria-pressed=true]{color:var(--accent)}.empty{padding:65px 15px;text-align:center;color:var(--muted)}details{margin-top:28px;border-bottom:1px solid var(--line);padding-bottom:18px;color:var(--muted)}summary{cursor:pointer;font-size:13px;width:fit-content;padding:8px 0}details p{font-size:14px;line-height:1.9;max-width:760px}.player-wrap{position:fixed;bottom:0;left:0;width:100%;background:#eeeee4;border-top:1px solid #cbd4c4;z-index:3}.player{max-width:1080px;margin:auto;padding:20px 38px 24px;display:grid;grid-template-columns:220px 1fr 44px;gap:25px;align-items:center}.now-label{font-size:10px;letter-spacing:1.5px;color:var(--muted);margin-bottom:7px}.now-title{font-size:18px;font-weight:600}.now-meta{font-size:11px;color:var(--muted);margin-top:5px}audio{width:100%;height:44px}.status{max-width:1004px;margin:0 auto;padding:0 0 12px;font-size:13px;color:#9b3d26}.status:empty{display:none}.footer{font-size:11px;color:var(--muted);margin-top:30px;letter-spacing:.5px}.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(max-width:640px){main{padding:24px 18px 205px}.intro{padding:32px 0 25px;align-items:flex-start;flex-direction:column;gap:15px}.list-label{display:none}.row{grid-template-columns:48px 1fr 40px 88px;gap:9px;padding:17px 5px;min-height:97px}.wave{display:none}.name{font-size:16px;gap:7px}.serial{font-size:18px}.note{font-size:9px}.duration{font-size:11px}.player{padding:16px 18px 20px;grid-template-columns:1fr 44px;gap:12px}.player audio{grid-column:1/-1;grid-row:2}.player .icon{grid-column:2;grid-row:1}.now-title{font-size:17px}.now-label{margin-bottom:4px}.filter{padding:11px 14px}.status{padding:0 18px 12px}.count{font-size:12px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}

.search-row{display:flex;gap:12px;margin:0 0 14px}.search-row input{min-width:0;flex:1;padding:12px 14px;border:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;border-radius:5px;min-height:46px}.search-row select{font:inherit;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:5px;padding:0 12px;min-height:46px}.search-row input:focus-visible,.search-row select:focus-visible{outline:2px solid var(--green);outline-offset:2px}.sample-details{margin:0 0 8px}.sample-details p{margin:8px 0 12px}.voice-version{font-size:10px;color:var(--muted)}@media(max-width:640px){.tabs{gap:0}.filter{padding:11px 10px}.search-row{gap:8px}.search-row select{max-width:110px}.row .sub{font-size:10px}.row .name{flex-wrap:wrap}}

.distribution{margin:0 0 24px;padding-bottom:16px}.distribution summary{display:flex;align-items:center;justify-content:space-between;width:100%;font-size:14px;color:var(--ink);gap:14px}.distribution summary:before{content:'▸';margin-right:5px}.distribution[open] summary:before{content:'▾'}.distribution summary span{margin-left:auto;font-size:12px;color:var(--muted)}.distribution table{width:100%;border-collapse:collapse;margin-top:10px;font-size:12px;font-variant-numeric:tabular-nums}.distribution th,.distribution td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:right}.distribution th:first-child,.distribution td:first-child{text-align:left}.distribution th{font-weight:500;color:var(--muted)}.distribution tfoot{font-weight:650}.group-title{display:flex;align-items:center;gap:12px;font-size:20px;font-weight:500;margin:25px 0 0;padding:18px 12px;background:var(--soft)}.group-title span{font-size:12px;color:var(--muted)}.ordinal{font-size:12px;font-weight:400;min-width:29px;font-variant-numeric:tabular-nums;color:var(--muted)}.footer{line-height:2}.footer a{text-underline-offset:3px;margin-right:12px}
.mast-tools{display:flex;align-items:center;gap:22px}.locale-switch{display:flex;gap:2px;border:1px solid var(--line);border-radius:6px;padding:3px}.locale-switch a{padding:9px 11px;min-height:40px;text-decoration:none;font-size:12px;border-radius:3px}.locale-switch a[aria-current="page"]{background:var(--green);color:var(--paper)}.name>span:last-child{overflow-wrap:anywhere}.distribution summary strong{font-weight:500}.distribution summary span{max-width:65%;text-align:right}@media(max-width:640px){.mast-tools{gap:8px}.local{display:none}.brand{font-size:16px}.brand i{font-size:20px;margin-left:4px}.locale-switch a{padding:9px 8px}.row{grid-template-columns:44px minmax(0,1fr) 34px 76px;gap:5px}.actions .icon{width:38px}.row .sub{overflow-wrap:anywhere}.search-row select{max-width:125px}.group-title{font-size:18px}.distribution summary span{font-size:11px}.list-label{font-size:10px}.player{gap:10px}}
.brand{letter-spacing:0}@media(max-width:640px){.brand{font-size:13px;line-height:1.5;overflow-wrap:anywhere}.mast{gap:10px}.mast-tools{flex-shrink:0}}

<body>
<main>
<header class="mast"><div class="brand">TTS-kokoro-voice-gallery</div><div class="mast-tools"><div data-i18n="community" class="local">__community__</div><nav class="locale-switch" data-i18n-aria="interface" aria-label="__interface__"><a href="index.html" data-locale="zh" lang="zh-CN" aria-current="__zhCurrent__">中文</a><a href="en.html" data-locale="en" lang="en" aria-current="__enCurrent__">English</a></nav></div></header>
<section class="intro"><div><p data-i18n="eyebrow" class="eyebrow">__eyebrow__</p><h1 data-i18n="heading">__heading__</h1></div><span class="count" id="count"></span></section>
<details class="distribution" open><summary><strong data-i18n="distribution">__distribution__</strong><span data-i18n="distributionSummary">__distributionSummary__</span></summary>__DISTRIBUTION__</details>
<nav class="filters" data-i18n-aria="filters" aria-label="__filters__"><div class="tabs"><button class="filter" data-lang="all" aria-pressed="true" data-i18n="all">__all__</button><button class="filter" data-lang="zh" aria-pressed="false" data-i18n="zh">__zh__</button><button class="filter" data-lang="en" aria-pressed="false" data-i18n="en">__en__</button><button class="filter" data-lang="other" aria-pressed="false" data-i18n="other">__other__</button></div><button id="favorites" class="favorite-filter" aria-pressed="false" data-i18n="favorites">__favorites__</button></nav>
<div class="search-row"><label data-i18n="search" class="sr" for="search">__search__</label><input id="search" type="search" data-i18n-placeholder="search" placeholder="__search__" autocomplete="off"><label data-i18n="gender" class="sr" for="gender">__gender__</label><select id="gender"><option value="all" data-i18n="allVoices">__allVoices__</option><option value="女声" data-i18n="female">__female__</option><option value="男声" data-i18n="male">__male__</option></select></div>
<details class="sample-details"><summary data-i18n="script">__script__</summary><p id="sample-text"></p></details>
<div class="list-label" aria-hidden="true"><span data-i18n="voice">__voice__</span><span data-i18n="preview">__preview__</span><span data-i18n="duration" style="text-align:right">__duration__</span><span data-i18n="actions" style="text-align:right">__actions__</span></div>
<section id="list" data-i18n-aria="voiceList" aria-label="__voiceList__"></section>
<p class="footer"><span data-i18n="independent">__independent__</span><br><a id="about-link" href="__aboutFile__" data-i18n="about">__about__</a><a href="https://github.com/purryc/TTS-kokoro-voice-gallery" data-i18n="github">__github__</a><a href="https://huggingface.co/hexgrad/Kokoro-82M" data-i18n="model">__model__</a></p>
</main>
<div class="player-wrap"><div class="player"><div><div class="now-label" id="now-label">__selected__</div><div class="now-title" id="now-title">Heart</div><div class="now-meta" id="now-meta"></div></div><audio id="audio" controls preload="metadata" data-i18n-aria="player" aria-label="__player__"></audio><a id="download" class="icon" download data-i18n-aria="downloadCurrent" aria-label="__downloadCurrent__"></a></div><p id="status" class="status" role="status"></p></div>
<script>
const voices = __VOICE_DATA__;
const playIcon='<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>';
const pauseIcon='<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>';
const heartIcon='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z"/></svg>';
const downloadIcon='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5"/></svg>';
const translations = __I18N_DATA__;
let locale='__locale__',statusKey='';
function t(key,values={}){return translations[locale][key].replace(/\{(\w+)\}/g,(_,name)=>values[name]??'');}
function voiceName(v,uiLocale=locale){return uiLocale==='en'?v.name.replace('女声','Female').replace('男声','Male'):v.name;}
function genderName(g){return t(g==='女声'?'female':'male');}
function languageName(v){return t(v.id.startsWith('a')?'american':v.id.startsWith('b')?'british':v.lang);}
function setStatus(key){statusKey=key;status.textContent=key?t(key):'';}
let lang='all',gender='all',query='',onlyFavorites=false,selected=voices.find(v=>v.id==='af_heart')||voices[0],request=0,favorites=new Set();
try{const saved=JSON.parse(localStorage.getItem('kokoro-favorites-v1')||'[]');if(Array.isArray(saved))favorites=new Set(saved.filter(id=>voices.some(v=>v.id===id)));}catch{}
const audio=document.querySelector('#audio'),list=document.querySelector('#list'),status=document.querySelector('#status');
function duration(n){return Math.floor(n/60)+':'+String(Math.round(n%60)).padStart(2,'0')}
function label(v){return languageName(v)+' · '+genderName(v.gender)}
function save(){try{localStorage.setItem('kokoro-favorites-v1',JSON.stringify([...favorites]));}catch{setStatus('saveError')}}
function render(){
 const shown=voices.filter(v=>(lang==='all'||v.lang===lang||(lang==='other'&&!['zh','en'].includes(v.lang)))&&(gender==='all'||gender===v.gender)&&(!onlyFavorites||favorites.has(v.id))&&(!query||[v.id,v.name,voiceName(v,'en'),v.langLabel,translations.en[v.id.startsWith('a')?'american':v.id.startsWith('b')?'british':v.lang],v.gender,translations.en[v.gender==='女声'?'female':'male'],translations.en[v.lang],translations.zh[v.lang],v.version,String(v.sequence).padStart(3,'0')].join(' ').toLowerCase().includes(query)));
 document.querySelector('#count').textContent=t('count',{shown:shown.length,total:voices.length});
 const row=v=>`<article class="row ${selected.id===v.id?'selected':''}" data-id="${v.id}"><button class="play" data-play="${v.id}" aria-label="${t('play',{name:voiceName(v)})}">${playIcon}</button><div><div class="name"><span class="ordinal">${String(v.sequence).padStart(3,'0')}</span><span class="${v.lang==='zh'?'serial':''}">${voiceName(v)}</span></div><div class="sub">${label(v)} · ${v.id} <span class="voice-version">${v.version}</span></div></div><svg class="wave" viewBox="0 0 192 32" preserveAspectRatio="none" aria-hidden="true">${v.wave.map((h,i)=>`<rect x="${i*3}" y="${(32-h)/2}" width="1.6" height="${h}" rx=".8" fill="currentColor"/>`).join('')}</svg><span class="duration">${duration(v.duration)}</span><div class="actions"><button class="icon fav" data-fav="${v.id}" aria-label="${t(favorites.has(v.id)?'unfavorite':'favorite',{name:voiceName(v)})}" aria-pressed="${favorites.has(v.id)}">${heartIcon}</button><a class="icon" href="${v.file}" download aria-label="${t('download',{name:voiceName(v)})}">${downloadIcon}</a></div></article>`;
 list.innerHTML=shown.length?['女声','男声'].map(group=>{const subset=shown.filter(v=>v.gender===group);return subset.length?`<section class="voice-group" aria-label="${genderName(group)}"><h2 class="group-title">${genderName(group)}<span>${t('voiceCount',{count:subset.length})}</span></h2>${subset.map(row).join('')}</section>`:'';}).join(''):`<p class="empty">${t('empty')}</p>`;
 sync();
}
function sync(){const playing=!audio.paused&&!audio.ended;document.querySelector('#now-label').textContent=t(playing?'playing':'selected');list.querySelectorAll('[data-play]').forEach(b=>{const active=selected.id===b.dataset.play&&playing;b.innerHTML=active?pauseIcon:playIcon;b.setAttribute('aria-label',t(active?'pause':'play',{name:voiceName(voices.find(v=>v.id===b.dataset.play))}));});}
function select(v){selected=v;document.querySelector('#sample-text').textContent=v.text;document.querySelector('#sample-text').lang=v.lang;audio.src=v.file;document.querySelector('#now-title').textContent=voiceName(v);document.querySelector('#now-meta').textContent=label(v)+' · '+v.id;const a=document.querySelector('#download');a.href=v.file;a.innerHTML=downloadIcon;}
async function toggle(id){const token=++request;setStatus('');if(selected.id===id&&!audio.paused){audio.pause();return;}if(selected.id!==id){audio.pause();select(voices.find(v=>v.id===id));render();}else if(audio.ended){audio.currentTime=0;}try{await audio.play();}catch(e){if(token===request&&e.name!=='AbortError')setStatus('playError');}}
list.addEventListener('click',e=>{const play=e.target.closest('[data-play]');if(play){toggle(play.dataset.play);return;}const fav=e.target.closest('[data-fav]');if(fav){const id=fav.dataset.fav;favorites.has(id)?favorites.delete(id):favorites.add(id);save();render();const target=list.querySelector(`[data-fav="${id}"]`);(target||document.querySelector('#favorites')).focus();}});
document.querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click',()=>{lang=b.dataset.lang;document.querySelectorAll('[data-lang]').forEach(x=>x.setAttribute('aria-pressed',x===b));render();}));
document.querySelector('#favorites').addEventListener('click',e=>{onlyFavorites=!onlyFavorites;e.currentTarget.setAttribute('aria-pressed',onlyFavorites);render();});
document.querySelector('#search').addEventListener('input',e=>{query=e.target.value.trim().toLowerCase();render();});
document.querySelector('#gender').addEventListener('change',e=>{gender=e.target.value;render();});
for(const event of ['play','pause','ended'])audio.addEventListener(event,sync);
audio.addEventListener('error',()=>{setStatus('loadError');sync();});
function applyLocale(next,updateUrl=false){
 locale=next;
 document.documentElement.lang=t('htmlLang');document.title=t('pageTitle');
 for(const [selector,key] of [['meta[name="description"]','description'],['meta[property="og:title"]','pageTitle'],['meta[property="og:description"]','ogDescription']])document.querySelector(selector).content=t(key);
 document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=t(el.dataset.i18n));
 document.querySelectorAll('[data-i18n-aria]').forEach(el=>el.setAttribute('aria-label',t(el.dataset.i18nAria)));
 document.querySelectorAll('[data-i18n-placeholder]').forEach(el=>el.placeholder=t(el.dataset.i18nPlaceholder));
 document.querySelectorAll('[data-locale]').forEach(el=>el.setAttribute('aria-current',el.dataset.locale===locale?'page':'false'));
 document.querySelector('#about-link').href=locale==='en'?'about-en.html':'about.html';
 document.querySelector('#now-title').textContent=voiceName(selected);
 document.querySelector('#now-meta').textContent=label(selected)+' · '+selected.id;
 const file=locale==='en'?'en.html':'index.html';
 const publicUrl='https://purryc.github.io/TTS-kokoro-voice-gallery/'+(locale==='en'?file:'');
 document.querySelector('link[rel="canonical"]').href=publicUrl;document.querySelector('meta[property="og:url"]').content=publicUrl;
 if(updateUrl&&location.protocol!=='file:'){const url=new URL(location.href);url.pathname=url.pathname.replace(/[^/]*$/,file);history.replaceState(null,'',url);}
 setStatus(statusKey);render();
}
document.querySelectorAll('[data-locale]').forEach(link=>link.addEventListener('click',e=>{if(e.ctrlKey||e.metaKey||e.shiftKey||e.altKey)return;e.preventDefault();applyLocale(link.dataset.locale,true);}));
select(selected);applyLocale(locale);
</script>
</body>
